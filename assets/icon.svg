<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Vibrant border gradient (Electric Cyan to Neon Emerald) - Pops on both dark & light backgrounds -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Note paper background (Deep Slate/Navy: high contrast on white, vibrant border pops on black) -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Folded corner gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Stylized G letter gradient -->
    <linearGradient id="gLetterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow/Drop shadow for 3D depth -->
    <filter id="noteShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Note Body with Folded Top-Right Corner -->
  <path d="M 28 16 
           H 76 
           L 100 40 
           V 106 
           A 6 6 0 0 1 94 112 
           H 34 
           A 6 6 0 0 1 28 106 
           V 22 
           A 6 6 0 0 1 34 16 Z" 
        fill="url(#paperGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round"
        filter="url(#noteShadow)" />

  <!-- Folded Corner Dog-Ear -->
  <path d="M 76 16 
           V 36 
           A 4 4 0 0 0 80 40 
           H 100 
           Z" 
        fill="url(#foldGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="2" 
        stroke-linejoin="round" />

  <!-- Subtle ruled notepad lines behind G -->
  <line x1="38" y1="28" x2="68" y2="28" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <line x1="38" y1="98" x2="90" y2="98" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <line x1="38" y1="104" x2="72" y2="104" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- Central Bold Stylized 'G' -->
  <!-- Outer arc of G: Center around (62, 63), Radius ~23 -->
  <path d="M 78 49
           A 22 22 0 1 0 84 66
           H 63
           V 60
           H 76
           A 15 15 0 1 1 54 49
           L 58 43
           A 22 22 0 0 0 40 64
           Z"
        fill="none" />

  <!-- Clean geometric 'G' shape for high legibility at 16px, 32px, 64px, 128px -->
  <path d="M 82 50
           C 77 44 69 41 61 41
           C 47 41 37 51 37 64
           C 37 77 47 87 61 87
           C 74 87 83 79 84 67
           H 61
           V 59
           H 92
           V 68
           C 91 84 78 95 61 95
           C 43 95 29 81 29 64
           C 29 47 43 33 61 33
           C 72 33 82 38 88 46
           Z"
        fill="url(#gLetterGrad)" />

  <!-- Electric '+' badges next to G (representing '++') -->
  <!-- First '+' -->
  <path d="M 94 80 V 88 M 90 84 H 98" 
        stroke="#00f2fe" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- Second '+' -->
  <path d="M 104 80 V 88 M 100 84 H 108" 
        stroke="#38ef7d" 
        stroke-width="2.5" 
        stroke-linecap="round" />
</svg>
